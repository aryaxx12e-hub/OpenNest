name: Cloudflare Build Spike

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Install temporary Cloudflare tooling
        run: npm install --no-save --package-lock=false @opennextjs/cloudflare@1.20.18 wrangler@4.166.0

      - name: Build Next.js and PWA
        run: npm run build

      - name: Build OpenNext Worker
        working-directory: apps/web
        run: npx opennextjs-cloudflare build --skipNextBuild

      - name: Check Worker bundle
        working-directory: apps/web
        run: npx wrangler deploy --dry-run --outdir /tmp/opennest-worker-dist
