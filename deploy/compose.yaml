services:
  opennest:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: opennest/server:local
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      OPENNEST_DATA_DIR: /data
      OPENNEST_HOST: 0.0.0.0
      OPENNEST_PORT: "8787"
      OPENNEST_PUBLIC_URL: ${OPENNEST_PUBLIC_URL:?Set OPENNEST_PUBLIC_URL to the exact public origin}
      OPENNEST_MCP_ENABLED: ${OPENNEST_MCP_ENABLED:-false}
    volumes:
      - opennest-data:/data
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  opennest-data:
    name: opennest-data
